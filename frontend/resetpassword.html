<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Reset password - CampusConnect</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="bg"></canvas>

  <div class="auth-wrap">
    <div class="auth-card">
      <h1>CampusConnect</h1>
      <p class="sub">Choose a new password</p>

      <div id="form">
        <label for="password">New password</label>
        <input id="password" type="password" placeholder="At least 6 characters" autocomplete="new-password">

        <label for="confirm">Confirm new password</label>
        <input id="confirm" type="password" placeholder="Type it again" autocomplete="new-password">

        <button id="resetBtn">Update password</button>
      </div>

      <div class="error" id="error" role="alert"></div>
      <div class="success" id="success" role="status"></div>
      <div class="switch" id="switch"><a href="login.html">Back to log in</a></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/scene3d.js"></script>
  <script src="js/api.js"></script>
  <script>
    const form = document.getElementById("form");
    const btn = document.getElementById("resetBtn");
    const error = document.getElementById("error");
    const success = document.getElementById("success");
    const switchRow = document.getElementById("switch");

    // Token URL ke #fragment (#token=...) mein hota hai. Padho, phir address bar se hata do.
    const token = new URLSearchParams(window.location.hash.slice(1)).get("token");
    history.replaceState(null, "", window.location.pathname + window.location.search);

    if (!token) {
      form.style.display = "none";
      error.textContent = "This reset link is missing or incomplete.";
      switchRow.innerHTML = '<a href="forgotpassword.html">Request a new reset link</a>';
    }

    async function doReset() {
      error.textContent = "";
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;

      if (password.length < 6) {
        error.textContent = "Password must be at least 6 characters.";
        return;
      }
      if (password !== confirm) {
        error.textContent = "The two passwords do not match.";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Updating...";
      try {
        const data = await api("/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, password }),
        });
        form.style.display = "none";
        success.textContent = data.message;
        switchRow.innerHTML = '<a href="login.html">Go to log in</a>';
      } catch (err) {
        error.textContent = err.message;
        btn.disabled = false;
        btn.textContent = "Update password";
      }
    }

    if (token) {
      btn.addEventListener("click", doReset);
      document.getElementById("confirm").addEventListener("keydown", (e) => {
        if (e.key === "Enter") doReset();
      });
    }
  </script>
</body>
</html>
