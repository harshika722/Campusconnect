<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusConnect - New Post</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">Campus<span>Connect</span></a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
    </div>
  </nav>

  <main class="container narrow">
    <div class="form-card">
      <h2>Create a New Post</h2>
      <p class="sub">Share a lost item, a found item, or a resource.</p>

      <div id="formMessage" class="form-message"></div>

      <form id="postForm">

        <label for="category">Category</label>
        <select id="category" required>
          <option value="lost">Lost</option>
          <option value="found">Found</option>
          <option value="resource">Resource</option>
        </select>

        <label for="title">Title</label>
        <input type="text" id="title" placeholder="e.g. Black wallet, Maths notes" required />

        <label for="description">Description</label>
        <textarea id="description" rows="4" placeholder="Add details so others can identify it" required></textarea>

        <label for="location">Location</label>
        <input type="text" id="location" placeholder="e.g. Library, Block A canteen" />

        <label for="date">Date</label>
        <input type="date" id="date" />

        <!-- Sirf Resource category ke liye dikhega -->
        <div id="priceBox" class="hidden">
          <label for="price">Price (₹) - leave 0 if free</label>
          <input type="number" id="price" min="0" value="0" />
        </div>

        <label for="photoUrl">Photo URL (optional)</label>
        <input type="url" id="photoUrl" placeholder="https://..." />

        <label for="tags">Tags (optional, separate with commas)</label>
        <input type="text" id="tags" placeholder="e.g. wallet, black, leather" />

        <button type="submit" class="submit-btn" id="submitBtn">Publish Post</button>
      </form>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/createpost.js"></script>
</body>
</html>
