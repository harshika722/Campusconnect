<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusConnect - Dashboard</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">Campus<span>Connect</span></a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="createpost.html" class="primary">+ New Post</a>
      <button id="logoutBtn">Logout</button>
    </div>
  </nav>

  <main class="container narrow wide">
    <h2 class="page-title" id="welcome">Dashboard</h2>

    <!-- CONTACT -->
    <section class="form-card contact-card">
      <h3>My contact</h3>
      <p class="sub">This is shown only to people whose claim you approve.</p>
      <div class="contact-row">
        <input type="text" id="contactInput" placeholder="Phone number or email" />
        <button class="btn primary" id="saveContactBtn">Save</button>
      </div>
      <p id="contactMsg" class="form-message"></p>
    </section>

    <!-- MY POSTS -->
    <h3 class="section-title">My posts</h3>
    <p id="message" class="message"></p>
    <section id="myPosts"></section>
  </main>

  <!-- EDIT POPUP -->
  <div id="editModal" class="modal hidden">
    <div class="form-card modal-box">
      <h2>Edit post</h2>
      <p id="editMsg" class="form-message error"></p>

      <label for="eTitle">Title</label>
      <input type="text" id="eTitle" />

      <label for="eDescription">Description</label>
      <textarea id="eDescription" rows="4"></textarea>

      <label for="eLocation">Location</label>
      <input type="text" id="eLocation" />

      <label for="eDate">Date</label>
      <input type="date" id="eDate" />

      <div id="ePriceBox" class="hidden">
        <label for="ePrice">Price (₹)</label>
        <input type="number" id="ePrice" min="0" />
      </div>

      <label for="ePhoto">Photo URL</label>
      <input type="url" id="ePhoto" />

      <label for="eTags">Tags (comma separated)</label>
      <input type="text" id="eTags" />

      <div class="modal-actions">
        <button class="btn" id="cancelEdit">Cancel</button>
        <button class="btn primary" id="saveEdit">Save changes</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
