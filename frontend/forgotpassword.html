<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password - CampusConnect</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="bg"></canvas>

  <div class="auth-wrap">
    <div class="auth-card">
      <h1>CampusConnect</h1>
      <p class="sub">Forgot your password?</p>
      <p class="help">Enter the email you signed up with. If an account exists, we will email you a link to choose a new password. The link works once and expires in 15 minutes.</p>

      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@college.edu" autocomplete="email" autocapitalize="none" spellcheck="false">

      <button id="sendBtn">Send reset link</button>
      <div class="error" id="error" role="alert"></div>
      <div class="success" id="success" role="status"></div>
      <div class="switch">Remembered it? <a href="login.html">Back to log in</a></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/scene3d.js"></script>
  <script src="js/api.js"></script>
  <script>
    const btn = document.getElementById("sendBtn");
    const error = document.getElementById("error");
    const success = document.getElementById("success");

    async function sendLink() {
      error.textContent = "";
      success.textContent = "";
      const email = document.getElementById("email").value.trim().toLowerCase();
      if (!email) {
        error.textContent = "Please enter your email.";
        return;
      }
      btn.disabled = true;
      btn.textContent = "Sending...";
      try {
        const data = await api("/auth/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });
        success.textContent = data.message; // email ho ya na ho, same message
      } catch (err) {
        error.textContent = err.message;
      }
      btn.disabled = false;
      btn.textContent = "Send reset link";
    }

    btn.addEventListener("click", sendLink);
    document.getElementById("email").addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendLink();
    });
  </script>
</body>
</html>
